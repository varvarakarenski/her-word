<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Companies</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/svg+xml" href="company.svg">
    </head>

    <body>
        <div class="menubar">
            <span><h2><a href="index.html">HerWord</a></h2></span>
            <a href="companies.html">Companies</a>
            <a href="clubs-and-teams.html">Clubs & Teams</a>
            <a href="labs.html">Labs</a>
            <a href="gyms.html">Gyms</a>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;700;800&display=swap" rel="stylesheet">
            <div class="menubar-profile"></div>
        </div>

        <div class="search-bar">
            <input type="search" class="search-input" placeholder="Search companies by name, description, or tag...">
            <button type="button" class="filter-toggle" aria-expanded="false">Filters</button>
            <button type="button" class="add-listing-toggle">+ Add a company</button>
        </div>

        <div class="filter-panel" hidden>
            <label>Region
                <select name="region">
                    <option value="">All regions</option>
                    <option>Northeast</option>
                    <option>Midwest</option>
                    <option>South</option>
                    <option>West</option>
                    <option>Remote</option>
                    <option>Other</option>
                </select>
            </label>
            <label>Sort by
                <select name="sort">
                    <option value="">Default</option>
                    <option value="rating-desc">Highest rated</option>
                    <option value="rating-asc">Lowest rated</option>
                    <option value="reviews">Most reviewed</option>
                    <option value="name">Name (A–Z)</option>
                </select>
            </label>
        </div>

        <div class="perfect-companies">

        </div>

        <div class="add-listing-overlay overlay-backdrop" hidden>
            <div class="overlay-panel">
                <button type="button" class="overlay-close">✕</button>
                <h2>Add a company</h2>
                <form class="add-listing-form">
                    <label>Name <input name="name" required></label>
                    <label>Description <textarea name="description" required></textarea></label>
                    <label>Location <input name="location" required></label>
                    <div class="tag-picker">
                        <span class="tag-picker-label">Tags</span>
                        <div class="tag-picker-options"></div>
                        <input type="hidden" name="tags">
                    </div>
                    <label>Industry <input name="industry" required></label>
                    <label>Logo URL (optional) <input name="logoUrl" type="url" placeholder="https://..."></label>
                    <button type="submit" class="add-listing-submit">Add company</button>
                </form>
            </div>
        </div>

        <script type="module" src="/src/companies.ts"></script>

        <div class="footer">
            <a href="https://github.com/varvarakarenski/her-word.git" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="privacy.html">Privacy</a>
        </div>

    </body>
</html>
